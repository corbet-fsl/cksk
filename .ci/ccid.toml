schema = 1
project = "cksk"

# Select affected checks explicitly; no implicit full language/platform matrix.
[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]

[checks.pack]
kind = "pack"
crates = "."

[release]
kind = "library"
version = "Cargo.toml"
registries = ["crates"]
build = ["pack"]

[render]
render_schema = 3

[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["rust"]
workflow = "ci"
command = ["bash", ".ci/run-job.sh"]
